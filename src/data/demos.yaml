- id: tsu-slz-candidates
  title: Finding landing-zone candidates
  summary: Candidate safe landing zones are detected in aerial imagery and compared by size and clearance before one is selected.
  video: tsu-slz-candidates
  mode: loop
  kind: simulation
  teams: [tsu]
  useCase: emergency-landing
  shown: year-2-review

- id: tsu-iris-multi-uam
  title: 'IRIS: multi-UAM flight simulation'
  summary: A tour of TSU’s IRIS physics-based simulation, with downtown, suburban, and airport scenes and several eVTOL aircraft flying coordinated routes.
  video: tsu-iris-multi-uam
  mode: player
  kind: simulation
  teams: [tsu]
  useCase: emergency-landing
